name: Daily Gita post

on:
  schedule:
    - cron: "40 0 * * *"   # backup timer, 6:10 AM IST (main trigger: cron-job.org)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (checks tokens and images, posts nothing)"
        type: boolean
        default: true
      force:
        description: "Post even if already posted today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gita-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post next verse
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_RATIKANTA: ${{ secrets.IG_USER_ID_RATIKANTA }}
          IG_ACCESS_TOKEN_RATIKANTA: ${{ secrets.IG_ACCESS_TOKEN_RATIKANTA }}
          IG_USER_ID_GFY: ${{ secrets.IG_USER_ID_GFY }}
          IG_ACCESS_TOKEN_GFY: ${{ secrets.IG_ACCESS_TOKEN_GFY }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_VERSION: ${{ vars.LI_VERSION }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python post.py
      - name: Save progress
        if: always()
        run: |
          git config user.name "gita-bot"
          git config user.email "gita-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Posted next Gita verse" && git push)
